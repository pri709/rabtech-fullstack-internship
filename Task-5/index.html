<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProductHub | Management Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Login Section -->
    <section id="loginSection">
        <div class="login-container">
            <h1>ProductHub</h1>
            <p>Sign in to manage your products</p>

            <form id="loginForm">
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">Login</button>
                <p id="loginError"></p>
            </form>
        </div>
    </section>

    <!-- Dashboard Section -->
    <section id="dashboardSection" hidden>

        <header>
            <h1>ProductHub</h1>
            <div>
                <span id="welcomeMessage"></span>
                <button id="logoutBtn">Logout</button>
            </div>
        </header>

        <main class="dashboard">

            <div class="dashboard-heading">
                <div>
                    <h2>Product Management</h2>
                    <p>Manage your product collection</p>
                </div>
                <button id="addProductBtn">+ Add Product</button>
            </div>

            <!-- Product Form -->
            <section id="productFormSection" hidden>
                <h3 id="formTitle">Add New Product</h3>

                <form id="productForm">
                    <input type="hidden" id="productId">

                    <input
                        type="text"
                        id="productName"
                        placeholder="Product name"
                        required
                    >

                    <input
                        type="number"
                        id="productPrice"
                        placeholder="Price"
                        min="0.01"
                        step="0.01"
                        required
                    >

                    <input
                        type="text"
                        id="productCategory"
                        placeholder="Category"
                        required
                    >

                    <textarea
                        id="productDescription"
                        placeholder="Product description"
                        required
                    ></textarea>

                    <button type="submit">Save Product</button>
                    <button type="button" id="cancelBtn">Cancel</button>
                </form>
            </section>

            <!-- Product Catalog -->
            <section>
                <h3>Our Products</h3>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search products..."
                >

                <p id="productCount"></p>

                <div id="productList" class="product-grid"></div>

                <p id="emptyMessage" hidden>No products found.</p>
            </section>

        </main>
    </section>

    <script type="module" src="js/app.js"></script>

</body>
</html>
